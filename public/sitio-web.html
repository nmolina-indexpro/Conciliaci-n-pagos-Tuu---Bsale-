<style>
  :root{
    --bg:#F7F8F3; --surface:#FFFFFF; --surface-2:#F1F3EC; --line:#E3E7DC;
    --text:#1F2A24; --muted:#6B7568;
    --primary:#0F766E; --primary-dark:#0B5C55; --primary-dim:#E3F2F0;
    --amber:#D97706; --amber-dim:#FDF0DC;
    --green:#15803D; --green-bg:#E3F6E8;
    --red:#DC2626; --red-bg:#FCE8E8;
    --blue:#2563EB; --blue-bg:#E4ECFD;
    --shadow:0 1px 2px rgba(31,42,36,.05), 0 4px 12px rgba(31,42,36,.05);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans', sans-serif;-webkit-font-smoothing:antialiased;padding:24px 32px 50px 32px;}
  .wrap{max-width:none;margin:0;}
  header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:26px;gap:16px;}
  .logo{height:42px;display:block;justify-self:start;}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:25px;letter-spacing:0.2px;margin:0 0 5px 0;}
  h1 span{color:var(--primary);}
  h2{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;margin:0 0 4px 0;}
  .sub{color:var(--muted);font-size:13px;}
  .page-nav{display:flex;gap:2px;background:var(--surface-2);padding:4px;border-radius:10px;justify-self:center;min-width:0;max-width:100%;overflow-x:auto;scrollbar-width:none;}
  .page-nav::-webkit-scrollbar{display:none;}
  .page-nav a{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:0.1px;color:var(--muted);text-decoration:none;padding:7px 13px;border-radius:7px;transition:all .15s;white-space:nowrap;flex-shrink:0;}
  .page-nav a.active{background:var(--primary);color:#fff;box-shadow:var(--shadow);}
  .page-nav a:hover:not(.active){color:var(--text);background:rgba(0,0,0,.04);}
  .user-box{justify-self:end;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted);}
  .user-box b{color:var(--text);}
  .btn-logout{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12px;color:var(--muted);cursor:pointer;text-decoration:none;display:inline-block;}
  .btn-logout:hover{border-color:var(--red);color:var(--red);}

  select{background:var(--surface);border:1.5px solid var(--line);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;padding:8px 12px;border-radius:9px;font-size:13px;}
  button{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;border:none;border-radius:9px;padding:9px 16px;cursor:pointer;}
  .btn-ghost{background:var(--surface);color:var(--muted);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--primary);color:var(--primary);}

  .toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
  #status{font-size:12px;color:var(--muted);}
  #status.err{color:var(--red);}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
  @media (max-width:1100px){.grid{grid-template-columns:repeat(2,1fr);}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);}
  .card .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;margin-bottom:8px;}
  .card .big{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;}
  .card.alert .big{color:var(--red);}

  .seccion{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:22px;}
  .seccion-head{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.4px;font-size:10px;padding:9px;border-bottom:2px solid var(--line);background:var(--surface-2);}
  th.amount, td.amount{text-align:right;}
  td{padding:9px;border-bottom:1px solid var(--line);}
  .amount{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  .empty-note{color:var(--muted);font-size:12.5px;padding:10px 0;}
  .note-box{background:var(--blue-bg);border:1px solid #C3D9FB;border-radius:12px;padding:12px 16px;font-size:12.5px;margin-bottom:20px;color:var(--text);}
  .badge{font-family:'Space Grotesk',sans-serif;font-size:10.5px;padding:3px 10px;border-radius:999px;font-weight:700;}
  .badge.cargadores{background:var(--amber-dim);color:var(--amber);}
  .badge.pantallas{background:var(--blue-bg);color:var(--blue);}
  .badge.baterias{background:var(--red-bg);color:var(--red);}
  .badge.quiebre{background:var(--red);color:#fff;}
  .badge.riesgo{background:var(--amber);color:#fff;}
  th.sortable{cursor:pointer;user-select:none;}
  th.sortable:hover{color:var(--primary);}
</style>
<meta name="theme-color" content="#0F766E">

<body>
<div class="wrap">

  <header>

      <div class="menu-herramientas" id="menuHerramientas">

        <a href="reportar-error.html">🆘 Ayuda</a>

      <img src="https://cdn.shopify.com/s/files/1/0522/7436/4595/files/logo_y_slogan_-_bco_Mesa_de_trabajo_2.png?v=1768595366" alt="IndexStore" class="logo">

    <nav class="page-nav">
      <a href="home.html">Home</a>

      <a href="eficiencia-tickets.html">Tickets</a>
      <a href="analisis.html">Análisis</a>
      <a href="clientes-whatsapp.html">WhatsApp</a>
    </nav>
    <div class="user-box" id="userBox"></div>
  </header>

  <div class="toolbar">
    <div>
      <h1>Sitio <span>Web</span></h1>
      <div class="sub">Estado del catálogo publicado en indexstore.cl.</div>
    </div>

  <div id="avisoWrap"></div>

</div>

<script src="restriccion-usuario.js"></script>
<script src="menu-herramientas.js"></script>
<script>
const $ = id => document.getElementById(id);
function fmtNum(n){ return Math.round(n||0).toLocaleString('es-CL'); }
// ---------- Aviso: stock en Bsale pero no visible en Shopify ----------
// Cruza el stock real de Bsale contra el estado de cada SKU en Shopify --
// si un producto tiene stock disponible pero está "draft"/"archived" en la
// tienda, no aparece para los clientes y se pierden ventas sin que nadie lo
// note (caso real que motivó esto: SKU CARALUSBC01 con stock pero
// archivado). Solo se avisa de SKUs que SÍ existen en Shopify con otro
// estado -- un SKU de Bsale que nunca se sube a la tienda (ej. un insumo
// interno) no es una alerta real, así que no se asume nada de los que no
// aparecen en el mapa. days=1 en bsale-sku-report: acá solo interesa el
// stock actual (siempre es "de hoy", no depende del período), no el
// historial de ventas -- pedir el período más corto evita cargar de más.
const ESTADO_SHOPIFY_LABEL = { draft: 'Borrador', archived: 'Archivado' };
function renderAvisoStockShopify(skusBsale, estadoPorSku, error){
  // Siempre un resultado explícito -- ver renderAvisoPreciosDistintos para
  // el mismo criterio (revisado-sin-problemas se ve distinto de no-revisado).
  if(error) return `<div class="note-box" style="background:var(--amber-dim);border-color:#F3D9A8;">⚠ No se pudo revisar el estado de los productos en Shopify: ${error}</div>`;
  if(!Object.keys(estadoPorSku).length) return `<div class="note-box" style="background:var(--amber-dim);border-color:#F3D9A8;">⚠ No se pudo obtener el catálogo de Shopify para comparar contra el stock de Bsale.</div>`;

  const conProblema = skusBsale
    .filter(s => s.stockActual > 0)
    .map(s => ({ ...s, shopify: estadoPorSku[s.code] }))
    .filter(s => s.shopify && s.shopify.status !== 'active');
  if(!conProblema.length){
    return `<div class="note-box" style="background:var(--green-bg);border-color:#B7E4C7;">✅ <b>No hay productos con stock disponible que estén archivados o en borrador en Shopify.</b></div>`;
  }

  conProblema.sort((a,b) => b.stockActual - a.stockActual);
  const filas = conProblema.slice(0, 20).map(s => `
    <li>
      <b>${s.code}</b> — ${s.nombre} · Stock: ${fmtNum(s.stockActual)} ·
      <span class="badge quiebre">${ESTADO_SHOPIFY_LABEL[s.shopify.status] || s.shopify.status}</span>
      <a href="${s.shopify.adminUrl}" target="_blank" rel="noopener">Ver en Shopify ↗</a>
    </li>`).join('');
  const nota = conProblema.length > 20 ? `<div class="empty-note">...y ${conProblema.length - 20} más.</div>` : '';

  return `<div class="note-box" style="background:var(--red-bg);border-color:#F5C6C6;">
    ⚠ <b>${conProblema.length} producto(s) con stock disponible pero no visibles en la tienda online</b> (archivados o en borrador en Shopify) — se están perdiendo ventas.
    <ul style="margin:8px 0 0 0;padding-left:18px;">${filas}</ul>
    ${nota}
  </div>`;
}

function fmtMoneda(n){ return '$' + Math.round(n||0).toLocaleString('es-CL'); }

// ---------- Aviso: precio distinto entre Bsale y Shopify ----------
// Cruza el precio de cada SKU ACTIVO en Shopify (visible/comprable) contra
// su precio en la lista de precios de Bsale (ver obtenerPreciosBsalePorSku
// en negocio.js) -- si difieren, se le está cobrando distinto al cliente
// según por dónde compre. Bsale no tiene un único precio por SKU (vive en
// listas de precio separadas, puede haber varias) -- listaNombre viene del
// backend para poder confirmar a ojo que es la lista correcta.
function renderAvisoPreciosDistintos(estadoPorSku, preciosBsalePorSku, listaNombre, error){
  // Siempre se muestra un resultado explícito -- "revisé y no encontré
  // nada" (verde) tiene que verse distinto de "no revisé" (ámbar), para no
  // dejar la duda de si simplemente no se comparó nada.
  if(error){
    return `<div class="note-box" style="background:var(--amber-dim);border-color:#F3D9A8;">⚠ No se pudo comparar precios entre Bsale y Shopify: ${error}</div>`;
  }
  if(!preciosBsalePorSku || !Object.keys(preciosBsalePorSku).length){
    return `<div class="note-box" style="background:var(--amber-dim);border-color:#F3D9A8;">⚠ No se pudo obtener la lista de precios de Bsale para comparar (revisa que BSALE_ACCESS_TOKEN esté configurado y que exista la lista "LISTA DE PRECIOS BASE").</div>`;
  }

  const TOLERANCIA = 1; // ignora diferencias de menos de $1 (redondeo)
  const conProblema = Object.entries(estadoPorSku)
    .filter(([, s]) => s.status === 'active' && s.precio != null)
    .map(([sku, s]) => ({ sku, ...s, precioBsale: preciosBsalePorSku[sku] }))
    .filter(s => s.precioBsale != null && Math.abs(s.precioBsale - s.precio) > TOLERANCIA);

  const notaLista = listaNombre ? `<div class="empty-note" style="margin-top:6px;">Precio de Bsale (con IVA) tomado de la lista "${listaNombre}".</div>` : '';

  if(!conProblema.length){
    return `<div class="note-box" style="background:var(--green-bg);border-color:#B7E4C7;">
      ✅ <b>No se encontraron diferencias de precio entre Bsale y Shopify.</b>
      ${notaLista}
    </div>`;
  }

  conProblema.sort((a,b) => Math.abs(b.precioBsale - b.precio) - Math.abs(a.precioBsale - a.precio));
  const filas = conProblema.slice(0, 20).map(s => `
    <li>
      <b>${s.sku}</b> — ${s.titulo} · Bsale: ${fmtMoneda(s.precioBsale)} · Shopify: ${fmtMoneda(s.precio)}
      <a href="${s.adminUrl}" target="_blank" rel="noopener">Ver en Shopify ↗</a>
    </li>`).join('');
  const nota = conProblema.length > 20 ? `<div class="empty-note">...y ${conProblema.length - 20} más.</div>` : '';

  return `<div class="note-box" style="background:var(--red-bg);border-color:#F5C6C6;">
    💲 <b>${conProblema.length} producto(s) con precio distinto entre Bsale y Shopify</b> — revisa cuál es el correcto antes de que un cliente pague de más o de menos.
    <ul style="margin:8px 0 0 0;padding-left:18px;">${filas}</ul>
    ${nota}${notaLista}
  </div>`;
}

async function cargar(){
  const status = $('status');
  status.className = '';
  status.textContent = 'Consultando Shopify y Bsale...';
  try{
    const [bsaleRes, estadoRes] = await Promise.all([
      fetch('/api/bsale-sku-report?days=1').then(r=>r.json()).catch(()=>({skus:[]})),
      fetch('/api/negocio?recurso=alertas-stock-shopify').then(r=>r.json()).catch(()=>({estadoPorSku:{}}))
    ]);
    const avisoStock = renderAvisoStockShopify(bsaleRes.skus || [], estadoRes.estadoPorSku || {}, estadoRes.error);
    const avisoPrecios = renderAvisoPreciosDistintos(estadoRes.estadoPorSku || {}, estadoRes.preciosBsalePorSku || {}, estadoRes.listaPrecioBsaleNombre, estadoRes.error);
    $('avisoWrap').innerHTML = avisoStock + avisoPrecios; // ambas funciones siempre devuelven un resultado explícito, nunca vacío
    status.textContent = 'Actualizado.';
  }catch(err){
    status.className = 'err';
    status.textContent = 'Error: ' + err.message;
  }
}


async function cargarSesionUsuario(){
  try{
    const res = await fetch('/api/auth-session');
    if(!res.ok) return;
    const u = await res.json();
    document.getElementById('userBox').innerHTML = `<span>Hola, <b>${u.nombre || u.email}</b></span><a href="reportar-error.html" class="btn-logout">🐞 Reportar error</a><button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</button>`;
    if(u.rol === 'admin'){
      const nav = document.getElementById('navUsuarios');
      if(nav) nav.style.display = '';
    }
    aplicarRestriccionesUsuario(u.rol);
    aplicarRestriccionPaginas(u.paginas);
  }catch(err){ /* silencioso */ }
}
async function cerrarSesion(){
  await fetch('/api/auth-session', { method: 'DELETE' });
  location.href = '/login.html';
}

cargar();
cargarSesionUsuario();
</script>
</body>
</html>

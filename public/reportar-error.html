<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Reportar un error — IndexStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F8F3; --surface:#FFFFFF; --surface-2:#F1F3EC; --line:#E3E7DC;
    --text:#1F2A24; --muted:#6B7568;
    --primary:#0F766E; --primary-dark:#0B5C55; --primary-dim:#E3F2F0;
    --amber:#D97706; --amber-dim:#FDF0DC;
    --green:#15803D; --green-bg:#E3F6E8;
    --red:#DC2626; --red-bg:#FCE8E8;
    --shadow:0 1px 2px rgba(31,42,36,.05), 0 4px 12px rgba(31,42,36,.05);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans', sans-serif;padding:24px 32px 50px 32px;}
  .wrap{max-width:none;margin:0;}
  header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:26px;gap:16px;}
  .logo{height:42px;display:block;justify-self:start;}
  .page-nav{display:flex;gap:2px;background:var(--surface-2);padding:4px;border-radius:10px;justify-self:center;min-width:0;max-width:100%;overflow-x:auto;scrollbar-width:none;}
  .page-nav::-webkit-scrollbar{display:none;}
  .page-nav a{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:0.1px;color:var(--muted);text-decoration:none;padding:7px 13px;border-radius:7px;transition:all .15s;white-space:nowrap;flex-shrink:0;}
  .page-nav a.active{background:var(--primary);color:#fff;box-shadow:var(--shadow);}
  .page-nav a:hover:not(.active){color:var(--text);background:rgba(0,0,0,.04);}
  .user-box{justify-self:end;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted);}
  .user-box b{color:var(--text);}
  .btn-logout{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12px;color:var(--muted);cursor:pointer;text-decoration:none;display:inline-block;}
  .btn-logout:hover{border-color:var(--red);color:var(--red);}

  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:23px;margin:0 0 6px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:22px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:22px;}
  label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;display:block;margin-bottom:6px;}
  select,textarea,input[type=text]{width:100%;background:var(--bg);border:1.5px solid var(--line);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;padding:10px 12px;border-radius:9px;font-size:13.5px;}
  textarea{min-height:110px;resize:vertical;}
  select:focus,textarea:focus,input:focus{outline:none;border-color:var(--primary);}
  .campo{margin-bottom:14px;}
  button{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;border:none;border-radius:9px;padding:11px 22px;cursor:pointer;}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:var(--shadow);}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-primary:disabled{opacity:0.6;cursor:not-allowed;}
  .msg{font-size:13px;padding:10px 14px;border-radius:10px;margin-bottom:14px;}
  .msg.ok{background:var(--green-bg);color:var(--green);}
  .msg.err{background:var(--red-bg);color:var(--red);}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.4px;font-size:10px;padding:9px;border-bottom:2px solid var(--line);background:var(--surface-2);}
  td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top;}
  .badge{font-family:'Space Grotesk',sans-serif;font-size:10px;padding:3px 9px;border-radius:999px;font-weight:700;white-space:nowrap;}
  .badge.pendiente{background:var(--amber-dim);color:var(--amber);}
  .badge.en-progreso{background:#DBEAFE;color:#1D4ED8;}
  .badge.resuelto{background:var(--green-bg);color:var(--green);}
  .badge.observacion{background:#EDE9FE;color:#6D28D9;}
  .empty-note{color:var(--muted);font-size:12.5px;padding:14px 0;}
  select.selectEstado{font-size:11px;padding:5px 8px;}
  tr.fila-reporte{cursor:pointer;}
  tr.fila-reporte:hover{background:var(--surface-2);}
  .btn-eliminar{background:none;border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:11px;color:var(--red);cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:600;}
  .btn-eliminar:hover{background:var(--red-bg);border-color:var(--red);}

  .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(31,42,36,.45);z-index:100;align-items:center;justify-content:center;padding:20px;}
  .modal-backdrop.abierto{display:flex;}
  .modal-box{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:0 8px 30px rgba(31,42,36,.25);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);}
  .modal-head h2{font-family:'Space Grotesk',sans-serif;font-size:16px;margin:0;}
  .modal-cerrar{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;}
  .modal-body{padding:18px 22px;}
  .detalle-fila{display:flex;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);}
  .detalle-fila:last-child{border-bottom:none;}
  .detalle-fila b{min-width:110px;color:var(--muted);font-weight:600;flex-shrink:0;}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--line);}
</style>
<meta name="theme-color" content="#0F766E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="responsive.css">
</head>
<body>
<div class="wrap">

  <header>
    <div class="header-left">
      <button class="btn-settings" onclick="toggleMenuHerramientas(event)" title="Configuración">⚙️</button>
      <div class="menu-herramientas" id="menuHerramientas">
        <a href="usuarios.html" id="navUsuarios" style="display:none;">👤 Usuarios</a>
        <a href="reportar-error.html">🆘 Ayuda</a>
        <a href="guia-uso.html">📘 Guía de uso</a>
      </div>
      <img src="https://cdn.shopify.com/s/files/1/0522/7436/4595/files/logo_y_slogan_-_bco_Mesa_de_trabajo_2.png?v=1768595366" alt="IndexStore" class="logo">
    </div>
    <nav class="page-nav">
      <a href="home.html">Home</a>
      <a href="index.html">Flujo de Caja</a>
      <a href="conciliacion.html">Conciliación</a>
      <a href="compras.html">Compras</a>
      <a href="alertas-stock.html">Alertas de Stock</a>
      <a href="oportunidades-comerciales.html">Oportunidades</a>
      <a href="sitio-web.html">Sitio Web</a>
      <a href="eficiencia-tickets.html">Tickets</a>
    </nav>
    <div class="user-box" id="userBox"></div>
  </header>

  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
    <h1 style="margin:0;">🐞 Reportar un error</h1>
    <img src="zoho-desk-logo.png" alt="Zoho Desk" title="Zoho Desk" style="height:48px;">
  </div>
  <div class="sub">Cuéntanos qué pasó — le llega un aviso directo a soporte, y puedes ver acá abajo cómo va tu reporte.</div>

  <div class="card">
    <div id="mensajeForm"></div>
    <div class="campo">
      <label>Tipo de reporte</label>
      <select id="fTipo">
        <option value="error">Error</option>
        <option value="observacion">Observación</option>
      </select>
    </div>
    <div class="campo">
      <label>¿En qué página pasó?</label>
      <select id="fPagina">
        <option value="">No estoy seguro / no aplica</option>
        <option value="Flujo de Caja">Flujo de Caja</option>
        <option value="Conciliación">Conciliación</option>
        <option value="Compras">Compras</option>
        <option value="Alertas de Stock">Alertas de Stock</option>
        <option value="Usuarios">Usuarios</option>
        <option value="Otra">Otra</option>
      </select>
    </div>
    <div class="campo">
      <label>¿Qué intentabas hacer y qué pasó?</label>
      <textarea id="fDescripcion" placeholder="Ej: Entré a Compras, elegí 90 días, y la tabla se quedó cargando sin mostrar nada."></textarea>
    </div>
    <button class="btn-primary" id="btnEnviar" onclick="enviarReporte()">Enviar reporte</button>
  </div>

  <div class="card">
    <h1 style="font-size:15px;margin-bottom:4px;">Mis reportes</h1>
    <div class="sub" style="margin-bottom:14px;" id="subReportes">Cargando...</div>
    <div id="wrapReportes"><p class="empty-note">Cargando...</p></div>
  </div>

</div>

<div class="modal-backdrop" id="modalDetalle" onclick="if(event.target===this) cerrarModal()">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modalTitulo">Reporte</h2>
      <button class="modal-cerrar" onclick="cerrarModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script src="restriccion-usuario.js"></script>
<script src="menu-herramientas.js"></script>
<script>
const $ = id => document.getElementById(id);
let rolActual = 'usuario';

async function cargarSesionUsuario(){
  try{
    const res = await fetch('/api/auth-session');
    if(!res.ok) return;
    const u = await res.json();
    rolActual = u.rol;
    document.getElementById('userBox').innerHTML = `<span>Hola, <b>${u.nombre || u.email}</b></span><button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</button>`;
    if(u.rol === 'admin'){
      const nav = document.getElementById('navUsuarios');
      if(nav) nav.style.display = '';
    }
    // Nota: aquí NO se aplican las restricciones de copia/descarga -- esta
    // página de soporte no tiene información de negocio que proteger, y el
    // usuario necesita poder escribir y enviar su reporte con normalidad.
    $('subReportes').textContent = u.rol === 'admin' ? 'Viendo los reportes de todos los usuarios.' : 'Viendo solo tus reportes.';
    cargarReportes();
  }catch(err){ /* silencioso */ }
}
async function cerrarSesion(){
  await fetch('/api/auth-session', { method: 'DELETE' });
  location.href = '/login.html';
}

async function enviarReporte(){
  const msg = $('mensajeForm');
  msg.innerHTML = '';
  const descripcion = $('fDescripcion').value.trim();
  const pagina = $('fPagina').value;
  const tipo = $('fTipo').value;
  if(!descripcion){ msg.innerHTML = `<div class="msg err">Cuéntanos qué pasó antes de enviar.</div>`; return; }

  $('btnEnviar').disabled = true;
  $('btnEnviar').textContent = 'Enviando...';
  try{
    const res = await fetch('/api/negocio?recurso=reportes', {
      method: 'POST', headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ descripcion, pagina, tipo })
    });
    const data = await res.json();
    if(!res.ok){ msg.innerHTML = `<div class="msg err">${data.error}</div>`; return; }
    $('fDescripcion').value = '';
    $('fPagina').value = '';
    $('fTipo').value = 'error';
    if(data.correo && !data.correo.enviado){
      msg.innerHTML = `<div class="msg err">El reporte se guardó, pero el correo de aviso NO se pudo enviar: ${data.correo.motivo || 'motivo desconocido'}</div>`;
    } else {
      msg.innerHTML = `<div class="msg ok">Reporte enviado. Gracias — lo puedes ver en la lista de abajo.</div>`;
    }
    cargarReportes();
  }catch(err){
    msg.innerHTML = `<div class="msg err">Error: ${err.message}</div>`;
  }finally{
    $('btnEnviar').disabled = false;
    $('btnEnviar').textContent = 'Enviar reporte';
  }
}

const RESPONSABLE_FIJO = 'Nicolás Molina';
let reportesActuales = [];

function badgeEstado(estado){
  const clase = estado.replace(' ', '-');
  return `<span class="badge ${clase}">${estado}</span>`;
}
function badgeTipo(tipo){
  if(tipo === 'objecion') return '<span class="badge en-progreso">Objeción</span>';
  if(tipo === 'observacion') return '<span class="badge observacion">Observación</span>';
  return '<span class="badge pendiente">Error</span>';
}

async function cargarReportes(){
  try{
    const res = await fetch('/api/negocio?recurso=reportes');
    const data = await res.json();
    if(!res.ok){ $('wrapReportes').innerHTML = `<p class="empty-note">${data.error}</p>`; return; }
    reportesActuales = data.reportes || [];
    if(reportesActuales.length === 0){ $('wrapReportes').innerHTML = `<p class="empty-note">Sin reportes todavía.</p>`; return; }

    $('wrapReportes').innerHTML = `
      <table>
        <thead><tr><th>ID</th><th>Tipo</th>${rolActual==='admin'?'<th>Usuario</th>':''}<th>Responsable</th><th>Página</th><th>Descripción</th><th>Fecha</th><th>Estado</th>${rolActual==='admin'?'<th></th>':''}</tr></thead>
        <tbody>
          ${reportesActuales.map(r => `
            <tr class="fila-reporte" onclick="abrirDetalleReporte(${r.id})">
              <td>#${r.id}</td>
              <td>${badgeTipo(r.tipo)}</td>
              ${rolActual==='admin'?`<td>${r.usuario_nombre || r.usuario_email}</td>`:''}
              <td>${RESPONSABLE_FIJO}</td>
              <td>${r.pagina || '—'}${r.sku_code?`<br><span class="empty-note">SKU: ${r.sku_code}</span>`:''}</td>
              <td style="max-width:260px;">${r.descripcion}</td>
              <td>${new Date(r.created_at).toLocaleString('es-CL', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })}</td>
              <td onclick="event.stopPropagation()">${rolActual==='admin'
                ? `<select class="selectEstado" onchange="cambiarEstado(${r.id}, this.value)">
                     <option value="pendiente" ${r.estado==='pendiente'?'selected':''}>Pendiente</option>
                     <option value="en progreso" ${r.estado==='en progreso'?'selected':''}>En progreso</option>
                     <option value="resuelto" ${r.estado==='resuelto'?'selected':''}>Resuelto</option>
                   </select>`
                : badgeEstado(r.estado)}</td>
              ${rolActual==='admin'?`<td onclick="event.stopPropagation()"><button class="btn-eliminar" onclick="eliminarReporte(${r.id})">Eliminar</button></td>`:''}
            </tr>`).join('')}
        </tbody>
      </table>`;
  }catch(err){
    $('wrapReportes').innerHTML = `<p class="empty-note">Error: ${err.message}</p>`;
  }
}

async function cambiarEstado(id, estado){
  try{
    const res = await fetch('/api/negocio?recurso=reportes', {
      method: 'PUT', headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ id, estado })
    });
    if(!res.ok){ const data = await res.json(); alert(data.error); }
    cerrarModal();
    cargarReportes();
  }catch(err){
    alert('Error: ' + err.message);
    cargarReportes();
  }
}

async function eliminarReporte(id){
  if(!confirm(`¿Eliminar el reporte #${id}? Esta acción no se puede deshacer.`)) return;
  try{
    const res = await fetch('/api/negocio?recurso=reportes', {
      method: 'DELETE', headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ id })
    });
    if(!res.ok){ const data = await res.json(); alert(data.error); }
    cerrarModal();
    cargarReportes();
  }catch(err){
    alert('Error: ' + err.message);
  }
}

function abrirDetalleReporte(id){
  const r = reportesActuales.find(x => x.id === id);
  if(!r) return;
  $('modalTitulo').textContent = `Reporte #${r.id}`;
  $('modalBody').innerHTML = `
    <div class="detalle-fila"><b>Tipo</b>${badgeTipo(r.tipo)}</div>
    <div class="detalle-fila"><b>Estado</b>${badgeEstado(r.estado)}</div>
    <div class="detalle-fila"><b>Responsable</b>${RESPONSABLE_FIJO}</div>
    <div class="detalle-fila"><b>Usuario</b>${r.usuario_nombre || ''} (${r.usuario_email})</div>
    <div class="detalle-fila"><b>Página</b>${r.pagina || '—'}</div>
    ${r.sku_code?`<div class="detalle-fila"><b>SKU</b>${r.sku_code}</div>`:''}
    <div class="detalle-fila"><b>Fecha</b>${new Date(r.created_at).toLocaleString('es-CL')}</div>
    <div class="detalle-fila" style="flex-direction:column;"><b>Descripción</b><div style="margin-top:6px;white-space:pre-wrap;">${r.descripcion}</div></div>
    ${r.contexto?`<div class="detalle-fila" style="flex-direction:column;"><b>Datos que veía</b><pre style="white-space:pre-wrap;font-size:11px;background:var(--surface-2);padding:8px 10px;border-radius:8px;margin-top:6px;">${JSON.stringify(r.contexto, null, 2)}</pre></div>`:''}
  `;
  $('modalFoot').innerHTML = rolActual==='admin' ? `
    <select class="selectEstado" onchange="cambiarEstado(${r.id}, this.value)">
      <option value="pendiente" ${r.estado==='pendiente'?'selected':''}>Pendiente</option>
      <option value="en progreso" ${r.estado==='en progreso'?'selected':''}>En progreso</option>
      <option value="resuelto" ${r.estado==='resuelto'?'selected':''}>Resuelto</option>
    </select>
    <button class="btn-eliminar" onclick="eliminarReporte(${r.id})">Eliminar</button>
  ` : '';
  $('modalDetalle').classList.add('abierto');
}
function cerrarModal(){ $('modalDetalle').classList.remove('abierto'); }

cargarSesionUsuario();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Recuperar contraseña — IndexStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F8F3; --surface:#FFFFFF; --line:#E3E7DC;
    --text:#1F2A24; --muted:#6B7568;
    --primary:#0F766E; --primary-dark:#0B5C55;
    --red:#DC2626; --red-bg:#FCE8E8;
    --green:#166534; --green-bg:#E9F5EC;
    --shadow:0 1px 2px rgba(31,42,36,.05), 0 8px 24px rgba(31,42,36,.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:'Plus Jakarta Sans',sans-serif;color:var(--text);}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:36px 34px;box-shadow:var(--shadow);width:100%;max-width:380px;}
  .logo{height:44px;display:block;margin:0 auto 24px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;text-align:center;margin:0 0 10px;}
  .sub{font-size:13px;color:var(--muted);text-align:center;margin:0 0 24px;line-height:1.5;}
  label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;display:block;margin-bottom:6px;}
  .campo{margin-bottom:16px;}
  input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--text);}
  input:focus{outline:none;border-color:var(--primary);}
  button{width:100%;padding:12px;border:none;border-radius:9px;background:var(--primary);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;cursor:pointer;margin-top:6px;}
  button:hover{background:var(--primary-dark);}
  button:disabled{opacity:0.6;cursor:not-allowed;}
  .error{background:var(--red-bg);color:var(--red);border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:16px;display:none;}
  .error.show{display:block;}
  .exito{background:var(--green-bg);color:var(--green);border-radius:9px;padding:14px;font-size:13.5px;line-height:1.5;display:none;}
  .exito.show{display:block;}
  .volver{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--primary);text-decoration:none;}
  .volver:hover{text-decoration:underline;}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://cdn.shopify.com/s/files/1/0522/7436/4595/files/logo_y_slogan_-_bco_Mesa_de_trabajo_2.png?v=1768595366" alt="IndexStore">
    <h1>Recuperar contraseña</h1>
    <p class="sub" id="sub">Ingresa el correo con el que inicias sesión y te mandamos un enlace para crear una contraseña nueva.</p>
    <div class="error" id="error"></div>
    <div class="exito" id="exito"></div>
    <form id="form">
      <div class="campo">
        <label for="email">Correo</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <button type="submit" id="btn">Enviar enlace</button>
    </form>
    <a class="volver" href="/login.html">Volver a iniciar sesión</a>
  </div>

<script>
const $ = id => document.getElementById(id);

$('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const btn = $('btn');
  const error = $('error');
  error.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  try {
    const res = await fetch('/api/negocio?recurso=auth-recuperar-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('email').value.trim() })
    });
    const data = await res.json();
    if (!res.ok) {
      error.textContent = data.error || 'No se pudo enviar el enlace';
      error.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Enviar enlace';
      return;
    }
    // Respuesta siempre genérica (exista o no el correo, a propósito -- ver
    // manejarAuthRecuperarPassword en api/negocio.js) -> se muestra tal
    // cual, no hay nada más que decidir acá.
    $('form').style.display = 'none';
    $('sub').style.display = 'none';
    $('exito').textContent = data.mensaje || 'Si el correo está registrado, te enviamos un enlace para recuperar tu contraseña.';
    $('exito').classList.add('show');
  } catch (err) {
    error.textContent = 'Error de conexión: ' + err.message;
    error.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Enviar enlace';
  }
});
</script>
</body>
</html>
